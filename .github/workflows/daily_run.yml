name: Daily Research Paper Slack Briefing

on:
  schedule:
    # 매일 아침 07:30 KST (전날 UTC 22:30) 및 저녁 07:30 KST (당일 UTC 10:30)
    - cron: '30 10,22 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # history.db 커밋 및 푸시 권한

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Paper Bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python main.py

      - name: Commit and push sent history DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.db || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent papers history"
            git pull --rebase origin main
            git push origin main
          fi
